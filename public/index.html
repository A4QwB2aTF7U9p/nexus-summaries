<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Resumidor de PDFs</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; }
        input, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
        button { padding: 0.5rem 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SaaS Resumidor PDF</h1>
        <div id="auth">
            <h2>Acceder</h2>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">Login</button>
        </div>
        <div id="app" style="display:none;">
            <h2>Bienvenido</h2>
            <input type="text" id="title" placeholder="Título del documento">
            <textarea id="text" placeholder="Pega el texto aquí"></textarea>
            <button onclick="summarize()">Resumir (Consumo: 1 crédito / Ilimitado si Premium)</button>
            <div id="result"></div>
        </div>
    </div>
    <script>
        async function login() {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
            });
            if(res.ok) { document.getElementById('auth').style.display='none'; document.getElementById('app').style.display='block'; }
            else alert('Error');
        }
        async function summarize() {
            const res = await fetch('/api/app/summarize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({documentTitle: document.getElementById('title').value, documentText: document.getElementById('text').value})
            });
            const data = await res.json();
            if(data.success) document.getElementById('result').innerHTML = data.summary;
            else alert(data.error);
        }
    </script>
</body>
</html>
